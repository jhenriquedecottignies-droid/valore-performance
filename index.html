<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valore Performance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F7F9FB; --ink:#0F2033; --muted:#5A6B7E; --line:#D7E0EA;
  --navy:#0E2A47; --navy-2:#163A60; --on-navy:#F2F6FA; --on-navy-muted:#A9BCD0;
  --ice:#E5EEF7; --amber:#C98A12; --amber-soft:#FBF0D8;
  --ok:#21704B; --ok-soft:#E1F1E8; --bad:#A93434; --bad-soft:#F7E3E3; --warn:#8A5F00; --warn-soft:#FFF3D3;
  --focus:#2F6FB3; --input:#FFFFFF; --calc:#EEF3F8;
  --serif:'Cambria','Source Serif 4',Georgia,serif;
  --sans:'Calibri','Source Sans 3','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0A1521; --surface:#112033; --surface-2:#0E1B2B; --ink:#E6EDF4; --muted:#93A5B8; --line:#24394F;
  --navy:#081626; --navy-2:#12304F; --on-navy:#EAF1F8; --on-navy-muted:#8FA6BD;
  --ice:#16293E; --amber:#E2A93B; --amber-soft:#3A2D12;
  --ok:#5FC28F; --ok-soft:#14321F; --bad:#EE8080; --bad-soft:#3A1818; --warn:#E8BC57; --warn-soft:#352812;
  --focus:#6FA8E8; --input:#0D1A29; --calc:#15283C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1521; --surface:#112033; --surface-2:#0E1B2B; --ink:#E6EDF4; --muted:#93A5B8; --line:#24394F;
  --navy:#081626; --navy-2:#12304F; --on-navy:#EAF1F8; --on-navy-muted:#8FA6BD;
  --ice:#16293E; --amber:#E2A93B; --amber-soft:#3A2D12;
  --ok:#5FC28F; --ok-soft:#14321F; --bad:#EE8080; --bad-soft:#3A1818; --warn:#E8BC57; --warn-soft:#352812;
  --focus:#6FA8E8; --input:#0D1A29; --calc:#15283C; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:1.65rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--serif);font-size:1.3rem;font-weight:700;letter-spacing:.01em}
.brand span{color:var(--on-navy-muted);font-size:.9rem}
.mes{display:flex;align-items:center;gap:8px}
.mes select{background:var(--navy-2);border:1px solid #2B4D72;color:var(--on-navy);border-radius:8px;padding:7px 10px;min-height:38px}
.save{font-size:.82rem;color:var(--on-navy-muted);min-width:90px;text-align:right}
.save.err{color:#FFB4A8}
nav.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--on-navy-muted);padding:10px 14px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:600}
nav.tabs button[aria-current="page"]{color:var(--on-navy);border-bottom-color:var(--amber)}
nav.tabs button:hover{color:var(--on-navy)}

main{max-width:1320px;margin:0 auto;padding:24px 20px 64px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:38px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.gold{background:var(--amber);border-color:var(--amber);color:#1B1203}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:16px}
.muted{color:var(--muted)}
.empty{padding:48px 24px;text-align:center}
.empty p{color:var(--muted);max-width:52ch;margin:8px auto 18px}

/* Chips de status */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.chip.habilitado{background:var(--ok-soft);color:var(--ok)}
.chip.nao_habilitado{background:var(--bad-soft);color:var(--bad)}
.chip.pendente{background:var(--warn-soft);color:var(--warn)}
.chip.invalido{background:var(--bad-soft);color:var(--bad);outline:1px dashed var(--bad)}
.chip.exc{background:var(--ice);color:var(--navy-2)}
:root[data-theme="dark"] .chip.exc{color:var(--on-navy)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip.exc{color:var(--on-navy)} }
.chip.cat{background:var(--amber-soft);color:var(--amber)}
.chip.st-aberto{background:var(--ok-soft);color:var(--ok)}
.chip.st-encerrado{background:var(--ice);color:var(--muted)}

/* Avatar */
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle}
.av.ini{display:inline-flex;align-items:center;justify-content:center;background:var(--ice);color:var(--navy-2);font-weight:700;font-family:var(--serif)}
:root[data-theme="dark"] .av.ini{color:var(--on-navy)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .av.ini{color:var(--on-navy)} }

/* Painel */
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.prod-hero .big{font-family:var(--serif);font-size:clamp(1.9rem,4vw,2.6rem);font-weight:700;line-height:1.1}
.bar{height:10px;background:var(--ice);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--navy-2);border-radius:99px}
:root[data-theme="dark"] .bar i{background:#4D86C2}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .bar i{background:#4D86C2} }
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:18px;border-top:1px solid var(--line)}
.stats div{padding:14px 12px 4px 0}
.stats div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.stats span{font-size:.88rem;color:var(--muted)}
.board-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tickers{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.ticker{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;background:var(--surface-2)}
.ticker b{font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
.ticker .q{font-weight:700;font-variant-numeric:tabular-nums}
.q.up{color:var(--ok)} .q.near{color:var(--warn)} .q.down{color:var(--bad)} .q.na{color:var(--muted)}
.board{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:860px}
.board th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:right;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.board th small{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:.74rem}
.board th:first-child,.board td:first-child{text-align:left}
.board td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.board tbody tr:hover td{background:var(--surface-2)}
.board td.opcell{position:sticky;left:0;background:var(--surface);z-index:1}
.board tbody tr:hover td.opcell{background:var(--surface-2)}
.tk .tk-v{display:block;font-weight:700;font-size:.98rem}
.tk .tk-d{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:4px}
.tk-up .tk-v{color:var(--ok)} .tk-up .tk-d{color:var(--ok);background:var(--ok-soft)}
.tk-near .tk-v{color:var(--warn)} .tk-near .tk-d{color:var(--warn);background:var(--warn-soft)}
.tk-down .tk-v{color:var(--bad)} .tk-down .tk-d{color:var(--bad);background:var(--bad-soft)}
.tk-na .tk-v,.tk-na .tk-d{color:var(--muted)} .tk-na .tk-d{background:var(--surface-2)}
.res{text-align:right}
.res .r1{font-weight:800;font-size:.98rem}
.res .r2{font-size:.8rem;margin-top:3px;color:var(--muted)}
.res.up .r1{color:var(--ok)} .res.down .r1{color:var(--bad)} .res.na .r1{color:var(--warn)}
.hits{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}
.hits i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.hits i.up{background:var(--ok)} .hits i.near{background:var(--warn)} .hits i.down{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend span b{font-weight:800;margin-right:4px}
.board tfoot td{border-top:2px solid var(--ink);border-bottom:0;background:var(--surface-2);padding-top:12px}
.board tfoot td.opcell{background:var(--surface-2)}
.board tfoot .tk-c{display:block;font-size:.74rem;color:var(--muted);margin-top:4px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:1.35rem;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.8rem}
.board.res-m{min-width:1080px}
.board.res-m td.mcell{text-align:left;font-weight:700}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.charts .wide{grid-column:1/-1}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.charts h3{margin:0 0 2px;font-size:1rem}
.charts .csub{color:var(--muted);font-size:.8rem;margin:0 0 8px}
svg.mchart{display:block;width:100%;height:auto;font-family:inherit}
svg.mchart .gl{stroke:var(--line);stroke-width:1}
svg.mchart .ax{fill:var(--muted);font-size:11px}
svg.mchart .vl{fill:var(--ink);font-size:10.5px;font-weight:700}
svg.mchart .b-up{fill:var(--ok)} svg.mchart .b-near{fill:var(--warn)} svg.mchart .b-down{fill:var(--bad)} svg.mchart .b-neu{fill:#3B7BC0} svg.mchart .b-na{fill:var(--line)}
svg.mchart .mt{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
svg.mchart .ln{fill:none;stroke:var(--amber);stroke-width:2.5}
svg.mchart .dt{fill:var(--amber);stroke:var(--surface);stroke-width:2}
svg.mchart .lt{fill:var(--amber);font-size:10.5px;font-weight:700}
.mini-rank{width:100%;border-collapse:collapse}
.mini-rank td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
.mini-rank tr:first-child td{border-top:0}
.mini-rank .pos{width:28px;color:var(--muted);font-weight:700}
.opn{display:flex;align-items:center;gap:10px;min-width:0}
.opn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{text-align:right}

/* Rei da Valore */
.rei{position:relative;background:var(--navy);color:var(--on-navy);border-radius:14px;padding:22px;overflow:hidden;border:1px solid #2A4B70}
.rei::after{content:"";position:absolute;inset:auto -60px -80px auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(226,169,59,.22),transparent 65%)}
.rei .t{font-family:var(--serif);font-size:.95rem;color:#E9C46A;letter-spacing:.02em}
.rei .who{display:flex;align-items:center;gap:16px;margin-top:14px;position:relative;z-index:1}
.rei .ph{position:relative;flex:none}
.rei .ph .crown{position:absolute;left:50%;top:-30px;transform:translateX(-50%) rotate(-6deg);width:52px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.rei .ph .av{border:3px solid #E2A93B;box-shadow:0 0 0 4px rgba(226,169,59,.18)}
.rei .nm{font-family:var(--serif);font-size:1.7rem;font-weight:700;line-height:1.1}
.rei .meta{color:var(--on-navy-muted);font-size:.92rem;margin-top:4px}
.rei .figs{display:flex;gap:22px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.rei .figs b{display:block;font-family:var(--serif);font-size:1.45rem;color:#F4D27A}
.rei .figs span{font-size:.82rem;color:var(--on-navy-muted)}
.rei.vazio{background:var(--surface);color:var(--ink);border-color:var(--line)}
.rei.vazio .t{color:var(--amber)}
.rei.vazio::after{display:none}
.rei .note{position:relative;z-index:1;font-size:.82rem;color:var(--on-navy-muted);margin:14px 0 0}

/* Lançamento */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px}
.grid th,.grid td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:.93rem}
.grid thead th{background:var(--surface-2);font-weight:700;font-size:.82rem;color:var(--muted);position:sticky;top:0}
.grid thead tr.metas th{font-weight:500;font-size:.78rem;color:var(--muted);padding-top:0}
.grid .sticky{position:sticky;left:0;background:var(--surface);z-index:2;min-width:170px;box-shadow:1px 0 0 var(--line)}
.grid thead .sticky{background:var(--surface-2);z-index:3}
.grid input{width:100%;min-width:92px;border:1px solid var(--line);background:var(--input);border-radius:6px;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.grid input.w-brl{min-width:132px}
.grid input.w-int{min-width:72px}
.grid input[readonly]{background:var(--calc);border-color:transparent;color:var(--muted)}
.grid input.bad{border-color:var(--bad);background:var(--bad-soft)}
.grid input:disabled{background:transparent;border-color:transparent}
.grid tr.msg td{padding:0 8px;border-bottom:1px solid var(--line);font-size:.84rem}
.grid tr.msg td:empty{display:none}
.grid tr.msg.vazio td{border-bottom:0;padding:0}
.grid tr.has-msg>*{border-bottom-color:transparent}
.grid .msgs{padding:2px 0 9px;display:flex;flex-direction:column;gap:2px}
.grid .msgs .e{color:var(--bad)} .grid .msgs .p{color:var(--warn)} .grid .msgs .n{color:var(--muted)}
.grid tfoot th,.grid tfoot td{background:var(--surface-2);font-weight:700;border-bottom:0}
.grid tfoot .sticky{background:var(--surface-2)}
.pts{font-weight:700;font-family:var(--serif);font-size:1rem}
.linkbtn{background:none;border:0;color:var(--focus);cursor:pointer;padding:4px;font-weight:600;font-size:.86rem;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.86rem;color:var(--muted);margin-top:12px}

/* Ranking */
.rank-list{display:flex;flex-direction:column;gap:10px}
.rk{display:grid;grid-template-columns:46px minmax(0,1.4fr) repeat(3,minmax(0,.7fr)) minmax(0,1.6fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.rk.king{border:2px solid var(--amber);background:linear-gradient(90deg,var(--amber-soft),var(--surface) 55%)}
.rk .pos{font-family:var(--serif);font-size:1.5rem;font-weight:700;color:var(--muted);text-align:center}
.rk.king .pos{color:var(--amber)}
.rk .lbl{font-size:.76rem;color:var(--muted);display:block}
.rk .val{font-weight:700}
.inds{display:flex;flex-wrap:wrap;gap:4px}
.ind{font-size:.76rem;border-radius:6px;padding:2px 7px;background:var(--ice);color:var(--muted);white-space:nowrap}
.ind.ok{background:var(--ok-soft);color:var(--ok)}
.ind.no{background:var(--bad-soft);color:var(--bad)}
.ind.pd{background:var(--warn-soft);color:var(--warn)}
.group-t{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}

/* Histórico */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:.86rem;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px 10px;min-height:38px;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.hist-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px}
table.plain{width:100%;border-collapse:collapse;font-size:.92rem}
table.plain th,table.plain td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
table.plain th{font-size:.8rem;color:var(--muted);font-weight:700}
.scroll-x{overflow-x:auto}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--sans)}

/* Configurações */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ind-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2)}
.ind-card h3{margin-bottom:10px}
.ind-card .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ops-table input,.ops-table select{border:1px solid var(--line);background:var(--input);border-radius:6px;padding:6px 8px;width:100%;min-width:90px}
.errs{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.92rem}
.tests li{padding:6px 0;border-bottom:1px solid var(--line);list-style:none}
.tests{padding:0;margin:10px 0 0}
.tests .ok{color:var(--ok);font-weight:700} .tests .no{color:var(--bad);font-weight:700}

/* Modal e aviso */
.modal-bg{position:fixed;inset:0;background:rgba(5,14,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;border:1px solid var(--line)}
.modal h2{margin-bottom:6px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:10px;z-index:60;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.ro-banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.92rem}

@media (max-width:980px){
  .dash,.hist-grid{grid-template-columns:1fr}
  .rk{grid-template-columns:40px minmax(0,1fr) auto;row-gap:8px}
  .rk .c-hide{display:none}
  .rk .inds-wrap{grid-column:2 / -1}
}
@media (max-width:640px){
  main{padding:18px 14px 56px}
  .top-in{padding:10px 14px 0}
  .brand span{display:none}
  h1{font-size:1.35rem}

<body>

<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
// ===== VALORE PERFORMANCE — motor de cálculo (funções puras, sem DOM) =====
const VP = (function () {
  const EPS = 1e-9;
  const isNum = v => typeof v === 'number' && isFinite(v);
  const clone = o => JSON.parse(JSON.stringify(o));
  const INDICADORES = ['producao', 'ativacao', 'inadimplencia', 'dut'];
  const NOMES = { producao: 'Produção', ativacao: 'Lojas ativas', inadimplencia: 'B1/B2/B3', dut: 'Recuperação DUT' };

  const DEFAULT_PARAMS = {
    base: 100,
    indicadores: {
      producao:      { meta: 1000000, peso: 40, passo: 10, pontosPorPasso: 4,   limite: 40 },
      ativacao:      { meta: 50,      peso: 20, passo: 5,  pontosPorPasso: 2,   limite: 20 },
      inadimplencia: { meta: 33700,   peso: 25, passo: 10, pontosPorPasso: 2.5, limite: 25 },
      dut:           { meta: 70,      peso: 15, passo: 5,  pontosPorPasso: 1.5, limite: 15 }
    },
    faixas: [
      { nome: 'Bronze', min: 100, valor: 500 },
      { nome: 'Prata', min: 110, valor: 750 },
      { nome: 'Ouro', min: 120, valor: 1000 },
      { nome: 'Diamante', min: 130, valor: 1500 },
      { nome: 'Elite', min: 140, valor: 2000 },
      { nome: 'Faixa máxima', min: 150, valor: 2500 }
    ],
    desempate: ['producao', 'inadimplencia', 'ativacao', 'dut'],
    metasIndividuais: {}
  };
  const DEFAULT_OPERADORES = ['Allan', 'Junior', 'Fábio', 'Ronaldo', 'Claudia', 'Anderson', 'Martinez']
    .map((n, i) => ({ id: 'op' + (i + 1), nome: n, regiao: '', status: 'ativo', foto: '' }));

  // Metas efetivas: padrão → meta individual do operador → exceção autorizada do mês (com justificativa)
  function metasEfetivas(params, opId, excecao) {
    const ind = params.indicadores;
    const m = {}; INDICADORES.forEach(k => (m[k] = ind[k].meta));
    const indiv = (params.metasIndividuais || {})[opId] || {};
    INDICADORES.forEach(k => { if (isNum(indiv[k])) m[k] = indiv[k]; });
    if (excecao && String(excecao.justificativa || '').trim()) INDICADORES.forEach(k => { if (isNum(excecao[k])) m[k] = excecao[k]; });
    return m;
  }

  function extras(cfg, delta) { // delta medido na unidade do "passo"
    if (!(cfg.passo > 0)) return 0;
    return Math.min(cfg.limite, Math.max(0, (delta / cfg.passo) * cfg.pontosPorPasso));
  }

  function faixaPara(pontuacao, faixas) {
    const fs = [...faixas].sort((a, b) => a.min - b.min);
    let f = null; for (const x of fs) if (pontuacao + EPS >= x.min) f = x;
    return f;
  }

  // Resolve um percentual a partir de contagens (prioridade) ou do valor informado diretamente
  function resolverPct(total, parte, direto, excecao, rotulos, erros, pend) {
    const temExc = !!(excecao && String(excecao.justificativa || '').trim());
    [[total, rotulos.total], [parte, rotulos.parte]].forEach(([v, l]) => {
      if (isNum(v) && v < 0) erros.push(l + ' não pode ser negativo.');
      else if (isNum(v) && !Number.isInteger(v)) erros.push(l + ' deve ser um número inteiro.');
    });
    if (isNum(direto) && (direto < 0 || direto > 100)) erros.push(rotulos.pct + ' deve estar entre 0% e 100%.');
    if (isNum(total) && isNum(parte) && parte > total) erros.push(rotulos.maior);
    if (isNum(total) && isNum(parte)) {
      if (total === 0) {
        if (temExc && isNum(direto)) return { v: direto, fonte: 'direto' };
        pend.push(rotulos.zero);
        return { v: null, fonte: null };
      }
      return { v: (parte * 100) / total, fonte: 'calculado' };
    }
    if (isNum(direto)) return { v: direto, fonte: 'direto' };
    pend.push(rotulos.falta);
    return { v: null, fonte: null };
  }

  function calcularOperador(entry, params, opId) {
    const e = entry || {};
    const erros = [], pend = [];
    const exc = e.excecao && String(e.excecao.justificativa || '').trim() ? e.excecao : null;
    const metas = metasEfetivas(params, opId, exc);
    const ind = params.indicadores;

    const producao = isNum(e.producao) ? e.producao : null;
    const inad = isNum(e.inadimplencia) ? e.inadimplencia : null;
    if (producao !== null && producao < 0) erros.push('Produção não pode ser negativa.');
    if (inad !== null && inad < 0) erros.push('B1/B2/B3 não pode ser negativo.');
    if (producao === null) pend.push('Informe a produção paga.');
    if (inad === null) pend.push('Informe o valor inadimplente B1/B2/B3 (use 0 se não houver).');

    const at = resolverPct(e.lojasTotal, e.lojasAtivas, e.ativPctDireto, exc, {
      total: 'Total de lojas', parte: 'Lojas ativas', pct: 'O % de ativação',
      maior: 'Lojas ativas maiores que o total de lojas.',
      zero: 'Carteira sem lojas válidas: requer validação da gestão (registre uma exceção com justificativa e informe o % apurado).',
      falta: 'Informe total e lojas ativas, ou o % de ativação apurado.'
    }, erros, pend);
    const du = resolverPct(e.dutElig, e.dutRec, e.dutPctDireto, exc, {
      total: 'DUTs elegíveis', parte: 'DUTs recuperados', pct: 'O % de recuperação DUT',
      maior: 'DUTs recuperados maiores que os elegíveis.',
      zero: 'Sem DUTs elegíveis: requer validação da gestão (registre uma exceção com justificativa e informe o % apurado).',
      falta: 'Informe DUTs elegíveis e recuperados, ou o % de recuperação.'
    }, erros, pend);

    const valores = { producao, ativacao: at.v, inadimplencia: inad, dut: du.v };
    const atingidos = {
      producao: producao === null ? null : producao + EPS >= metas.producao,
      ativacao: at.v === null ? null : at.v + EPS >= metas.ativacao,
      inadimplencia: inad === null ? null : inad <= metas.inadimplencia + EPS,
      dut: du.v === null ? null : du.v + EPS >= metas.dut
    };
    const prodRatio = producao !== null && metas.producao > 0 ? producao / metas.producao : null;

    const out = { status: null, erros, pendencias: pend, metas, valores, fontes: { ativacao: at.fonte, dut: du.fonte },
      atingidos, prodRatio, extras: null, pontuacao: null, faixa: null, premio: 0, motivos: [], excecao: !!exc };

    if (erros.length) { out.status = 'invalido'; return out; }
    if (pend.length) { out.status = 'pendente'; return out; }

    INDICADORES.forEach(k => { if (!atingidos[k]) out.motivos.push(k); });
    if (out.motivos.length) { out.status = 'nao_habilitado'; return out; }

    const ex = {
      producao: extras(ind.producao, (prodRatio - 1) * 100),
      ativacao: extras(ind.ativacao, at.v - metas.ativacao),
      inadimplencia: metas.inadimplencia > 0 ? extras(ind.inadimplencia, (1 - inad / metas.inadimplencia) * 100) : 0,
      dut: extras(ind.dut, du.v - metas.dut)
    };
    out.extras = ex;
    out.pontuacao = params.base + ex.producao + ex.ativacao + ex.inadimplencia + ex.dut; // sem arredondamento
    out.faixa = faixaPara(out.pontuacao, params.faixas);
    out.premio = out.faixa ? out.faixa.valor : 0;
    out.status = 'habilitado';
    return out;
  }

  function compararElegiveis(a, b, ordem) {
    const d = b.r.pontuacao - a.r.pontuacao;
    if (Math.abs(d) > EPS) return d;
    for (const k of ordem) {
      let x = 0;
      if (k === 'producao') x = b.r.prodRatio - a.r.prodRatio;
      else if (k === 'inadimplencia') x = a.r.valores.inadimplencia - b.r.valores.inadimplencia;
      else if (k === 'ativacao') x = b.r.valores.ativacao - a.r.valores.ativacao;
      else if (k === 'dut') x = b.r.valores.dut - a.r.valores.dut;
      if (Math.abs(x) > EPS) return x;
    }
    return 0;
  }

  // linhas: [{id, r}] → ranking, Rei da Valore e empates não resolvidos
  function rankear(linhas, params, reiManual) {
    const ordem = params.desempate || DEFAULT_PARAMS.desempate;
    const eleg = linhas.filter(l => l.r.status === 'habilitado').sort((a, b) => compararElegiveis(a, b, ordem));
    const pesoStatus = { nao_habilitado: 0, pendente: 1, invalido: 2 };
    const outros = linhas.filter(l => l.r.status !== 'habilitado')
      .sort((a, b) => (pesoStatus[a.r.status] - pesoStatus[b.r.status]) || ((b.r.valores.producao || 0) - (a.r.valores.producao || 0)));
    const empates = [];
    eleg.forEach((l, i) => {
      l.posicao = i + 1;
      if (i > 0 && compararElegiveis(eleg[i - 1], l, ordem) === 0) {
        l.posicao = eleg[i - 1].posicao;
        const g = empates.find(g => g.includes(eleg[i - 1].id));
        if (g) g.push(l.id); else empates.push([eleg[i - 1].id, l.id]);
      }
    });
    let rei = null, empateRei = null;
    if (eleg.length) {
      const topo = empates.find(g => g.includes(eleg[0].id));
      if (!topo) rei = eleg[0].id;
      else if (reiManual && topo.includes(reiManual)) rei = reiManual;
      else empateRei = topo;
    }
    return { elegiveis: eleg, outros, rei, empateRei, empates };
  }

  // ===== Cenários obrigatórios (seção 13) =====
  function executarTestes() {
    const P = clone(DEFAULT_PARAMS);
    const base = { producao: 1000000, lojasTotal: 100, lojasAtivas: 50, inadimplencia: 33700, dutElig: 10, dutRec: 7 };
    const T = [];
    const t = (nome, fn) => { try { const [ok, det] = fn(); T.push({ nome, ok: !!ok, detalhe: det }); } catch (err) { T.push({ nome, ok: false, detalhe: 'Erro: ' + err.message }); } };
    t('1. Atinge exatamente as quatro metas → 100 pontos e R$ 500', () => {
      const r = calcularOperador(base, P, 'x');
      return [r.status === 'habilitado' && Math.abs(r.pontuacao - 100) < EPS && r.premio === 500, `${r.status}, ${r.pontuacao} pts, R$ ${r.premio}`];
    });
    t('2. Supera todos os indicadores → extras e premiação progressiva', () => {
      const r = calcularOperador({ producao: 1300000, lojasTotal: 100, lojasAtivas: 60, inadimplencia: 20000, dutElig: 10, dutRec: 8 }, P, 'x');
      const esperado = 100 + 12 + 4 + (1 - 20000 / 33700) * 25 + 3;
      return [r.status === 'habilitado' && Math.abs(r.pontuacao - esperado) < 1e-6 && r.faixa.nome === 'Ouro' && r.premio === 1000, `${r.pontuacao.toFixed(4)} pts, ${r.faixa.nome}, R$ ${r.premio}`];
    });
    t('3. R$ 1,5 mi de produção com R$ 40 mil de B1/B2/B3 → sem bônus', () => {
      const r = calcularOperador({ ...base, producao: 1500000, inadimplencia: 40000 }, P, 'x');
      return [r.status === 'nao_habilitado' && r.premio === 0 && r.motivos.includes('inadimplencia'), `${r.status}, R$ ${r.premio}`];
    });
    t('4. Três indicadores ok, DUT em 69% → sem bônus', () => {
      const r = calcularOperador({ ...base, dutElig: 100, dutRec: 69 }, P, 'x');
      return [r.status === 'nao_habilitado' && r.premio === 0 && r.motivos.join() === 'dut', `${r.status}, motivos: ${r.motivos.join(', ')}`];
    });
    t('5. Dados incompletos → apuração pendente, sem pagamento', () => {
      const r = calcularOperador({ producao: 1200000, lojasTotal: 100, lojasAtivas: 60 }, P, 'x');
      return [r.status === 'pendente' && r.premio === 0 && r.pontuacao === null, `${r.status}, ${r.pendencias.length} pendência(s)`];
    });
    t('6. Empate na pontuação → critérios de desempate; empate total sinalizado', () => {
      const A = calcularOperador({ ...base, producao: 1100000 }, P, 'a');            // 104 pts via produção
      const B = calcularOperador({ ...base, lojasAtivas: 60 }, P, 'b');              // 104 pts via ativação
      const rk = rankear([{ id: 'b', r: B }, { id: 'a', r: A }], P, null);
      const C = calcularOperador(base, P, 'c'), D = calcularOperador(base, P, 'd');
      const rk2 = rankear([{ id: 'c', r: C }, { id: 'd', r: D }], P, null);
      const rk3 = rankear([{ id: 'c', r: C }, { id: 'd', r: D }], P, 'd');
      return [rk.rei === 'a' && rk2.rei === null && rk2.empateRei.length === 2 && rk3.rei === 'd',
        `desempate por produção → ${rk.rei}; empate total → decisão da gestão; escolha manual → ${rk3.rei}`];
    });
    t('7. Ninguém atinge os quatro indicadores → sem Rei', () => {
      const r1 = calcularOperador({ ...base, producao: 900000 }, P, 'a');
      const r2 = calcularOperador({ ...base, dutRec: 6 }, P, 'b');
      const rk = rankear([{ id: 'a', r: r1 }, { id: 'b', r: r2 }], P, null);
      return [rk.rei === null && rk.empateRei === null && rk.elegiveis.length === 0, 'Nenhum Rei da Valore neste mês'];
    });
    t('8. Mês encerrado preserva parâmetros e resultados', () => {
      const mes = { params: clone(P), entries: { x: base } };
      const antes = calcularOperador(mes.entries.x, mes.params, 'x').premio;
      const configAtual = clone(P); configAtual.faixas[0].valor = 900; configAtual.indicadores.producao.meta = 2000000;
      const depois = calcularOperador(mes.entries.x, mes.params, 'x').premio;
      const comNova = calcularOperador(mes.entries.x, configAtual, 'x').status;
      return [antes === 500 && depois === 500 && comNova === 'nao_habilitado', `mês guardado: R$ ${depois}; com regra nova seria: ${comNova}`];
    });
    t('9. Rejeita >100%, negativos, ativas > total, recuperados > elegíveis', () => {
      const a = calcularOperador({ ...base, lojasTotal: undefined, lojasAtivas: undefined, ativPctDireto: 120 }, P, 'x');
      const b = calcularOperador({ ...base, producao: -5 }, P, 'x');
      const c = calcularOperador({ ...base, lojasAtivas: 120 }, P, 'x');
      const d = calcularOperador({ ...base, dutRec: 11 }, P, 'x');
      return [[a, b, c, d].every(r => r.status === 'invalido' && r.premio === 0), [a, b, c, d].map(r => r.erros[0]).join(' | ')];
    });
    t('10. Denominador zero exige validação da gestão', () => {
      const a = calcularOperador({ ...base, lojasTotal: 0, lojasAtivas: 0 }, P, 'x');
      const b = calcularOperador({ ...base, dutElig: 0, dutRec: 0 }, P, 'x');
      const c = calcularOperador({ ...base, lojasTotal: 0, lojasAtivas: 0, ativPctDireto: 55, excecao: { justificativa: 'Carteira em transição, validado pela diretoria' } }, P, 'x');
      return [a.status === 'pendente' && b.status === 'pendente' && c.status === 'habilitado', `sem validação: ${a.status}/${b.status}; com validação: ${c.status}`];
    });
    return T;
  }

  return { EPS, isNum, clone, INDICADORES, NOMES, DEFAULT_PARAMS, DEFAULT_OPERADORES, metasEfetivas, calcularOperador, faixaPara, rankear, compararElegiveis, executarTestes };
})();
if (typeof module !== 'undefined') module.exports = VP;

// ===== CONEXÃO COM O SUPABASE — preencha com os dados do seu projeto =====
// Supabase > Project Settings > API: copie "Project URL" e a chave "anon public".
const SUPABASE_URL = 'https://dnqyfvstknnvxtupwgcc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_GxvE2AN_s0Z8x162EaWCOA_NBsPXKjh';
// ==========================================================================

// ===== VALORE PERFORMANCE — aplicação =====
(function () {
'use strict';
const { isNum, clone, INDICADORES, NOMES } = VP;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const fBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const f2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fInt = new Intl.NumberFormat('pt-BR');
const trunc2 = v => Math.floor(v * 100 + 1e-7) / 100; // exibição sem arredondar para cima
const brl = v => isNum(v) ? fBRL.format(v) : '—';
const pct = v => isNum(v) ? f2.format(v) + '%' : '—';
const pts = v => isNum(v) ? f2.format(trunc2(v)) : '—';
const mesLabel = id => { const [a, m] = id.split('-'); return `${MESES[+m - 1]}/${a}`; };
const mesCurto = id => { const [a, m] = id.split('-'); return `${MESES[+m - 1].slice(0, 3)}/${a.slice(2)}`; };
const STATUS_TXT = { habilitado: 'Habilitado', nao_habilitado: 'Não habilitado à premiação', pendente: 'Apuração pendente', invalido: 'Dados inválidos' };

// ---------- Estado ----------
const S = { config: null, months: {}, cur: null, tab: 'painel', mode: 'local', canWrite: true,
  cfgLoaded: false, monthsLoaded: false, dirty: new Set(), filtros: { op: '', ano: '', mes: '' }, cfgDraft: null, cfgErros: [], testes: null };

// ---------- Persistência ----------
const TABELA = 'valore_docs';
const SB_OK = /^https:\/\/.+/.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 30 && !!window.supabase;
const sb = SB_OK ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const Store = {
  channel: null,
  aplicar(id, data) {
    if (id === 'config') {
      if (!S.dirty.has('__config')) S.config = data ? normalizarConfig(clone(data)) : null;
    } else if (id.startsWith('mes:')) {
      const mid = id.slice(4);
      if (S.dirty.has(mid)) return;
      if (data) S.months[mid] = clone(data); else delete S.months[mid];
    }
  },
  async init() {
    S.mode = 'db';
    view.innerHTML = '<div class="empty"><p>Carregando dados…</p></div>';
    const { data, error } = await sb.from(TABELA).select('id,data');
    if (error) {
      view.innerHTML = `<div class="panel empty"><h1>Não foi possível carregar os dados</h1><p>${esc(error.message)}</p><p class="muted">Confira se o script SQL de instalação foi executado no Supabase.</p><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`;
      return;
    }
    S.config = null; S.months = {};
    (data || []).forEach(r => this.aplicar(r.id, r.data));
    S.cfgLoaded = S.monthsLoaded = true; afterData();
    this.channel = sb.channel('valore-docs')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABELA }, p => {
        if (p.eventType === 'DELETE') this.aplicar(p.old && p.old.id || '', null);
        else if (p.new) this.aplicar(p.new.id, p.new.data);
        afterData();
      })
      .subscribe();
  },
  async write(kind, id, data) {
    const row = { id: kind === 'config' ? 'config' : 'mes:' + id, data: clone(data), updated_at: new Date().toISOString() };
    let { error } = await sb.from(TABELA).upsert(row);
    if (error && !/42501|401|403|JWT/i.test(String(error.code) + error.message)) {
      await new Promise(r => setTimeout(r, 600 + Math.random() * 800));
      ({ error } = await sb.from(TABELA).upsert(row));
    }
    if (error) throw { code: /42501|401|403|JWT/i.test(String(error.code) + error.message) ? 'invalid_argument' : 'unavailable', message: error.message };
  },
  async remove(id) {
    const { error } = await sb.from(TABELA).delete().eq('id', 'mes:' + id);
    if (error) throw { code: 'unavailable', message: error.message };
  }
};

// Fila de gravação: uma escrita por vez por documento, agrupando digitação
const timers = {}; let chain = Promise.resolve();
function setSave(st, msg) {
  const el = $('#saveSt'); el.classList.toggle('err', st === 'error');
  el.textContent = st === 'saving' ? 'Salvando…' : st === 'saved' ? (S.mode === 'db' ? 'Salvo' : 'Salvo neste navegador') : st === 'error' ? (msg || 'Falha ao salvar') : '';
}
function queueSave(id, delay = 700) {
  if (!S.canWrite) return;
  S.dirty.add(id); setSave('saving');
  clearTimeout(timers[id]); timers[id] = setTimeout(() => flush(id), delay);
}
function flush(id) {
  clearTimeout(timers[id]); timers[id] = null;
  chain = chain.then(() => id === '__config' ? Store.write('config', null, S.config) : Store.write('mes', id, S.months[id]))
    .then(() => { if (!timers[id]) S.dirty.delete(id); setSave('saved'); })
    .catch(e => {
      S.dirty.delete(id);
      if (e && e.code === 'invalid_argument') { S.canWrite = false; setSave('error', 'Sem permissão de gravação'); render(); }
      else if (e && e.code === 'quota_exceeded') setSave('error', 'Limite de armazenamento atingido');
      else setSave('error', 'Falha ao salvar — tente novamente');
    });
  return chain;
}
function flushAll() { return Promise.all(Object.keys(timers).filter(k => timers[k]).map(flush)); }

const opPorId = id => (S.config?.operadores || []).find(o => o.id === id);
const fotoDe = id => opPorId(id)?.foto || '';
function opsDoMes(m) {
  if (m.operadores) return m.operadores.map(o => ({ ...o, foto: fotoDe(o.id) }));
  const ativos = S.config.operadores.filter(o => o.status === 'ativo');
  const extra = Object.keys(m.entries || {}).filter(id => !ativos.some(o => o.id === id)).map(opPorId).filter(Boolean);
  return [...ativos, ...extra];
}
function apurar(m) {
  const ops = opsDoMes(m);
  const linhas = ops.map(o => ({ id: o.id, op: o, r: VP.calcularOperador((m.entries || {})[o.id], m.params, o.id) }));
  const rk = VP.rankear(linhas, m.params, m.reiManual);
  const tot = { producao: 0, meta: 0, elegiveis: 0, nao: 0, pendentes: 0, custo: 0 };
  linhas.forEach(l => {
    if (isNum(l.r.valores.producao)) tot.producao += l.r.valores.producao;
    tot.meta += l.r.metas.producao;
    if (l.r.status === 'habilitado') { tot.elegiveis++; tot.custo += l.r.premio; }
    else if (l.r.status === 'nao_habilitado') tot.nao++;
    else tot.pendentes++;
  });
  return { ops, linhas, rk, tot };
}

// TELA 1 — Painel
// Totalizador da equipe por indicador
function totaisEquipe(m, ap) {
  const ents = m.entries || {};
  const T = { producao: 0, metaProd: 0, inad: 0, metaInad: 0, n: { producao: 0, ativacao: 0, inadimplencia: 0, dut: 0 },
    hit: { producao: 0, ativacao: 0, inadimplencia: 0, dut: 0 }, ops: ap.linhas.length };
  const pctAgg = { ativacao: { num: 0, den: 0, soma: 0, metas: 0, direto: false }, dut: { num: 0, den: 0, soma: 0, metas: 0, direto: false } };
  ap.linhas.forEach(l => {
    const r = l.r, e = ents[l.id] || {};
    INDICADORES.forEach(k => { if (isNum(r.valores[k])) { T.n[k]++; if (r.atingidos[k]) T.hit[k]++; } });
    T.metaProd += r.metas.producao;
    if (isNum(r.valores.producao)) T.producao += r.valores.producao;
    if (isNum(r.valores.inadimplencia)) { T.inad += r.valores.inadimplencia; T.metaInad += r.metas.inadimplencia; }
    [['ativacao', 'lojasAtivas', 'lojasTotal'], ['dut', 'dutRec', 'dutElig']].forEach(([k, p, t]) => {
      if (!isNum(r.valores[k])) return;
      const a = pctAgg[k]; a.soma += r.valores[k]; a.metas += r.metas[k];
      if (r.fontes[k] === 'calculado' && isNum(e[p]) && isNum(e[t])) { a.num += e[p]; a.den += e[t]; } else a.direto = true;
    });
  });
  const val = k => { const a = pctAgg[k], n = T.n[k]; if (!n) return { v: null, meta: null, modo: '' };
    return a.direto || !a.den ? { v: a.soma / n, meta: a.metas / n, modo: 'média' } : { v: a.num * 100 / a.den, meta: a.metas / n, modo: 'ponderado' }; };
  const at = val('ativacao'), du = val('dut');
  const nProd = T.n.producao, nInad = T.n.inadimplencia;
  const r = {
    valores: { producao: nProd ? T.producao : null, ativacao: at.v, inadimplencia: nInad ? T.inad : null, dut: du.v },
    metas: { producao: T.metaProd, ativacao: at.meta, inadimplencia: T.metaInad, dut: du.meta }
  };
  r.atingidos = {
    producao: nProd ? T.producao + 1e-9 >= T.metaProd : null, ativacao: at.v === null ? null : at.v + 1e-9 >= at.meta,
    inadimplencia: nInad ? T.inad <= T.metaInad + 1e-9 : null, dut: du.v === null ? null : du.v + 1e-9 >= du.meta
  };
  return { r, T, modo: { ativacao: at.modo, dut: du.modo } };
}
function linhaTotalBoard(m, ap) {
  const { r, T } = totaisEquipe(m, ap); const t = ap.tot;
  const cells = INDICADORES.map(k => cotacao(k, r).html.replace(/<\/td>$/, `<span class="tk-c">${T.hit[k]} de ${T.ops} bateram</span></td>`)).join('');

}

// Gráficos mensais da aba Resultados
function chartMes(dados, o) {
  const W = 640, H = o.alto || 230, L = 74, R = 12, T = 22, B = 28;
  const vals = dados.flatMap(d => [d.v, d.meta]).filter(isNum);
  const bruto = Math.max(o.minMax || 0, ...(vals.length ? vals : [1])) * 1.12 || 1;
  const p10 = Math.pow(10, Math.floor(Math.log10(bruto / 4))); const passo = [1, 2, 2.5, 5, 10].map(m => m * p10).find(st => bruto / st <= 4) || p10 * 10;
  const max = Math.ceil(bruto / passo) * passo;
  const n = dados.length, slot = (W - L - R) / n, bw = Math.min(34, slot * .62);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += passo) { const yy = y(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 6}" y="${yy + 4}" text-anchor="end">${o.eixo(v)}</text>`; }
  dados.forEach((d, i) => {
    const cx = L + slot * i + slot / 2;
    g += `<text class="ax" x="${cx}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
    if (isNum(d.v)) {
      const yy = y(d.v), h = Math.max(1, H - B - yy);
      g += `<rect class="b-${d.st || 'neu'}" x="${cx - bw / 2}" y="${yy}" width="${bw}" height="${h}" rx="3"><title>${esc(d.tip || '')}</title></rect>`;
      g += `<text class="vl" x="${cx}" y="${yy - 5}" text-anchor="middle">${o.rot(d.v)}</text>`;
    } else g += `<rect class="b-na" x="${cx - bw / 2}" y="${H - B - 3}" width="${bw}" height="3" rx="1.5"/>`;
    if (isNum(d.meta)) { const ym = y(d.meta); g += `<line class="mt" x1="${cx - slot * .45}" x2="${cx + slot * .45}" y1="${ym}" y2="${ym}"/>`; }
  });
  if (o.linha) {
    const p = dados.map((d, i) => isNum(d.l) ? [L + slot * i + slot / 2, y(d.l)] : null).filter(Boolean);
    if (p.length > 1) g += `<polyline class="ln" points="${p.map(q => q.join(',')).join(' ')}"/>`;
    dados.forEach((d, i) => { if (!isNum(d.l)) return; const cx = L + slot * i + slot / 2, cy = y(d.l);
      g += `<circle class="dt" cx="${cx}" cy="${cy}" r="4"/>` + (o.rotLinha ? `<text class="lt" x="${cx + 7}" y="${cy + 14}">${o.rotLinha(d)}</text>` : ''); });
  }
  return `<svg class="mchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">${g}</svg>`;
}

// TELA — Resultados mensais (totais de cada mês)
function resumoMes(id) {
  const m = S.months[id]; const ap = apurar(m); const eq = totaisEquipe(m, ap);

// Quadro estilo bolsa: indicadores por operador
function brlC(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return 'R$ ' + f2.format(v / 1e6) + ' mi';
  if (a >= 1e3) return 'R$ ' + new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 }).format(v / 1e3) + ' mil';
  return brl(v);
}
const IND_ROT = { producao: 'Produção', ativacao: 'Lojas ativas', inadimplencia: 'B1/B2/B3', dut: 'Recup. DUT' };
function cotacao(k, r) {
  const v = r.valores ? r.valores[k] : null, meta = r.metas ? r.metas[k] : null;
  if (!isNum(v) || !isNum(meta)) return { st: 'na', html: `<td class="tk tk-na" title="${IND_ROT[k]}: sem dado"><span class="tk-v">—</span><span class="tk-d">● sem dado</span></td>` };
  const hit = r.atingidos && r.atingidos[k];
  let val, delta, gap, tip;
  if (k === 'producao') {
    const d = meta > 0 ? (v / meta - 1) * 100 : 0;
    val = brlC(v); delta = (d >= 0 ? '+' : '−') + f2.format(Math.abs(d)) + '%'; gap = meta > 0 ? (meta - v) / meta : 1;
    tip = `Produção ${brl(v)} · meta ${brl(meta)}`;
  } else if (k === 'inadimplencia') {
    const d = meta > 0 ? (1 - v / meta) * 100 : 0;
    val = brlC(v); delta = (d >= 0 ? '+' : '−') + f2.format(Math.abs(d)) + '%'; gap = meta > 0 ? (v - meta) / meta : 1;
    tip = `B1/B2/B3 ${brl(v)} · limite ${brl(meta)} · ${d >= 0 ? 'folga' : 'excesso'} de ${f2.format(Math.abs(d))}%`;
  } else {
    const d = v - meta;
    val = pct(v); delta = (d >= 0 ? '+' : '−') + f2.format(Math.abs(d)) + ' p.p.'; gap = meta > 0 ? (meta - v) / meta : 1;
    tip = `${IND_ROT[k]} ${pct(v)} · meta ${pct(meta)}`;
  }
  const st = hit ? 'up' : (gap <= 0.10 + 1e-9 ? 'near' : 'down');
  const seta = st === 'up' ? '▲' : '▼';
  return { st, html: `<td class="tk tk-${st}" title="${esc(tip)}"><span class="tk-v">${val}</span><span class="tk-d">${seta} ${delta}</span></td>` };
}
function quadroPainel(m, ap) {

  const cont = {}; INDICADORES.forEach(k => cont[k] = { up: 0, near: 0, down: 0, na: 0 });
  const rows = linhas.map(l => {
    const r = l.r; const cells = INDICADORES.map(k => { const c = cotacao(k, r); cont[k][c.st]++; return c; });
    const nHit = cells.filter(c => c.st === 'up').length;
    const hits = `<span class="hits" aria-hidden="true">${cells.map(c => `<i class="${c.st === 'na' ? '' : c.st}"></i>`).join('')}</span>`;
    let res;
    if (r.status === 'habilitado') res = `<td class="res up"><div class="r1">▲ ${brl(r.premio)}</div><div class="r2">${hits}${pts(r.pontuacao)} pts · ${esc(r.faixa ? r.faixa.nome : '')}</div></td>`;

  }).join('');

  return `<div class="panel" style="margin-top:16px">

  </div>`;
}

// TELA 2 — Lançamento
const CAMPOS = [
  { f: 'producao', t: 'brl' }, { f: 'lojasTotal', t: 'int' }, { f: 'lojasAtivas', t: 'int' }, { f: 'ativPctDireto', t: 'pct' },
  { f: 'inadimplencia', t: 'brl' }, { f: 'dutElig', t: 'int' }, { f: 'dutRec', t: 'int' }, { f: 'dutPctDireto', t: 'pct' }
];
function fmtCampo(t, v) { if (!isNum(v)) return ''; return t === 'brl' ? f2.format(v) : t === 'pct' ? f2.format(v) : String(v); }
function parseCampo(t, s) {
  s = String(s).trim().replace(/R\$|%|\s/g, '');
  if (!s) return null;
  if (t === 'brl') { if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); }
  else if (t === 'int') { if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); s = s.replace(',', '.'); }
  else s = s.replace(',', '.');
  const n = Number(s); return isFinite(n) ? n : NaN;
}

function linhaHtml(l, m, ro) {

function atualizarLancamento() {
  const m = curMonth(); if (!m || !$('#grid')) return;
  const ap = apurar(m);
  ap.linhas.forEach(l => {
    const tr = $(`tr[data-op="${l.id}"]`); if (!tr) return;
    const r = l.r; const e = (m.entries || {})[l.id] || {};
    // percentuais calculados x informados
    [['ativPctDireto', 'lojasTotal', 'lojasAtivas', 'ativacao'], ['dutPctDireto', 'dutElig', 'dutRec', 'dut']].forEach(([f, tot, par, k]) => {
      const inp = $(`input[data-f="${f}"]`, tr);
      const calc = isNum(e[tot]) && isNum(e[par]) && e[tot] > 0;
      if (inp.disabled) { inp.value = isNum(r.valores[k]) ? f2.format(r.valores[k]) : ''; return; }
      inp.readOnly = calc; inp.title = calc ? 'Calculado a partir das quantidades' : 'Informe o % apurado se não tiver as quantidades';
      if (calc) inp.value = f2.format(e[par] * 100 / e[tot]);
      else if (document.activeElement !== inp) inp.value = fmtCampo('pct', e[f]);
    });
    $('[data-c="exc"]', tr).innerHTML = r.excecao ? ` <span class="chip exc" title="${esc(e.excecao.justificativa)}">Exceção</span>` : '';
    $('[data-c="status"]', tr).innerHTML = chip(r.status);
    $('[data-c="pts"]', tr).textContent = r.status === 'habilitado' ? pts(r.pontuacao) : '—';
    $('[data-c="premio"]', tr).innerHTML = r.status === 'habilitado' ? `<b>${brl(r.premio)}</b><div class="muted" style="font-size:.8rem">${esc(r.faixa?.nome || '')}</div>` : 'R$ 0,00';
    const msgs = [...r.erros.map(x => ['e', x]), ...(r.status === 'invalido' ? [] : r.pendencias.map(x => ['p', x]))];
    if (r.status === 'nao_habilitado') r.motivos.forEach(k => msgs.push(['n', motivoTxt(k, r)]));
    const mt = $(`tr[data-msg="${l.id}"]`);
    const temCampoRuim = $$('input.bad', tr).length > 0;
    if (temCampoRuim) msgs.unshift(['e', 'Valor não reconhecido: use números (ex.: 1.250.000,00).']);
    const mostrar = msgs.length && (r.status !== 'pendente' || Object.keys(e).some(k => k !== 'excecao' && isNum(e[k])) || temCampoRuim);
    mt.classList.toggle('vazio', !mostrar); tr.classList.toggle('has-msg', !!mostrar);
    $('td', mt).innerHTML = mostrar ? `<div class="msgs">${msgs.map(([c, x]) => `<span class="${c}">${esc(x)}</span>`).join('')}</div>` : '';
  });
  $('[data-tot="prod"]').textContent = brl(ap.tot.producao);
  $('[data-tot="premio"]').innerHTML = `<b>${brl(ap.tot.custo)}</b>`;
  $('[data-tot="resumo"]').textContent = `${ap.tot.elegiveis} habilitado(s) · ${ap.tot.nao} não habilitado(s) · ${ap.tot.pendentes} pendente(s)`;
}
function motivoTxt(k, r) {
  const v = r.valores[k], mt = r.metas[k];
  if (k === 'producao') return `Produção de ${brl(v)} abaixo da meta de ${brl(mt)}.`;
  if (k === 'ativacao') return `Ativação de ${pct(v)} abaixo da meta de ${pct(mt)}.`;
  if (k === 'inadimplencia') return `B1/B2/B3 de ${brl(v)} acima do limite de ${brl(mt)}.`;
  return `Recuperação DUT de ${pct(v)} abaixo da meta de ${pct(mt)}.`;
}

function graficoBarras(dados) {
  if (!dados.length) return '<p class="muted">Sem meses no filtro.</p>';
  const W = 560, H = 220, pad = 36, max = Math.max(1, ...dados.map(d => d.v));
  const bw = Math.min(46, (W - pad * 2) / dados.length * .6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Custo mensal das premiações">
    <line x1="${pad}" x2="${W - 10}" y1="${H - 30}" y2="${H - 30}" stroke="var(--line)"/>
    ${dados.map((d, i) => { const x = pad + (i + .5) * (W - pad * 2) / dados.length; const h = (H - 70) * d.v / max; return `<rect x="${x - bw / 2}" y="${H - 30 - h}" width="${bw}" height="${h}" rx="3" fill="var(--amber)"/><text x="${x}" y="${H - 12}" text-anchor="middle">${mesCurto(d.id)}</text><text x="${x}" y="${H - 36 - h}" text-anchor="middle">${d.v ? (d.v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : '0'}</text>`; }).join('')}</svg>`;
}
function graficoEvolucao(linhas) {
  if (!linhas.length) return '<p class="muted">Sem lançamentos no filtro.</p>';
  const W = 560, H = 230, pad = 40; const n = linhas.length;
  const maxP = Math.max(1, ...linhas.map(x => x.r.valores.producao || 0));
  const xAt = i => pad + (i + .5) * (W - pad - 14) / n;
  const pontos = linhas.map((x, i) => x.r.status === 'habilitado' ? [xAt(i), 26 + (H - 90) * (1 - Math.min(1, (x.r.pontuacao - 100) / 100))] : null);
  let path = ''; pontos.forEach(p => { if (p) path += (path ? ' L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); });
  const bw = Math.min(40, (W - pad) / n * .55);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Produção e pontuação por mês">
    <line x1="${pad}" x2="${W - 10}" y1="${H - 30}" y2="${H - 30}" stroke="var(--line)"/>
    ${linhas.map((x, i) => { const h = (H - 70) * (x.r.valores.producao || 0) / maxP; const cor = x.r.status === 'habilitado' ? 'var(--ok)' : x.r.status === 'nao_habilitado' ? 'var(--bad)' : 'var(--line)';
      return `<rect x="${xAt(i) - bw / 2}" y="${H - 30 - h}" width="${bw}" height="${h}" rx="3" fill="${cor}" opacity=".35"/><text x="${xAt(i)}" y="${H - 12}" text-anchor="middle">${mesCurto(x.mes)}</text>`; }).join('')}
    ${path ? `<path d="${path}" fill="none" stroke="var(--amber)" stroke-width="2.5"/>` : ''}
    ${pontos.map((p, i) => p ? `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--amber)"/><text x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${pts(linhas[i].r.pontuacao)}</text>` : '').join('')}
  </svg><p class="muted" style="font-size:.84rem;margin:6px 0 0">Barras: produção (verde = habilitado, vermelho = não habilitado). Linha dourada: pontuação final.</p>`;
}

function validarConfig(D) {
  const E = []; const P = D.params;
  if (!D.operadores.length) E.push('Cadastre ao menos um operador.');
  D.operadores.forEach(o => { if (!String(o.nome).trim()) E.push('Há operador sem nome.'); });
  INDICADORES.forEach(k => { const c = P.indicadores[k];
    ['meta', 'peso', 'passo', 'pontosPorPasso', 'limite'].forEach(f => { if (!isNum(c[f]) || c[f] < 0) E.push(`${NOMES[k]}: valor inválido em “${f}”.`); });
    if (!(c.passo > 0)) E.push(`${NOMES[k]}: o passo precisa ser maior que zero.`);
    if ((k === 'ativacao' || k === 'dut') && c.meta > 100) E.push(`${NOMES[k]}: meta acima de 100%.`);
    if ((k === 'producao' || k === 'inadimplencia') && !(c.meta > 0)) E.push(`${NOMES[k]}: a meta precisa ser maior que zero.`);
  });
  const somaPesos = INDICADORES.reduce((s, k) => s + (P.indicadores[k].peso || 0), 0);
  if (Math.abs(somaPesos - 100) > 1e-6) E.push(`A soma dos pesos é ${f2.format(somaPesos)}%; deve ser 100%.`);
  if (!isNum(P.base) || P.base < 0) E.push('Pontos de base inválidos.');
  if (!P.faixas.length) E.push('Cadastre ao menos uma faixa de premiação.');
  P.faixas.forEach(f => { if (!String(f.nome).trim() || !isNum(f.min) || !isNum(f.valor) || f.valor < 0) E.push(`Faixa “${f.nome || 'sem nome'}” com dados inválidos.`); });
  const mins = P.faixas.map(f => f.min); if (new Set(mins).size !== mins.length) E.push('Duas faixas começam na mesma pontuação.');
  Object.entries(P.metasIndividuais).forEach(([id, mi]) => INDICADORES.forEach(k => { if (mi[k] !== undefined && (!isNum(mi[k]) || mi[k] < 0 || ((k === 'ativacao' || k === 'dut') && mi[k] > 100))) E.push(`Meta individual inválida (${opPorId(id)?.nome || D.operadores.find(o => o.id === id)?.nome}: ${NOMES[k]}).`); }));
  return E;
}

// ---------- Modais e aviso ----------
function toast(msg) { const r = $('#toastRoot'); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t = setTimeout(() => (r.innerHTML = ''), 3200); }
function modal(html, onOk) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const close = () => (root.innerHTML = '');
  root.onclick = e => {
    if (e.target.classList.contains('modal-bg') || e.target.closest('[data-m="cancel"]')) close();
    const ok = e.target.closest('[data-m]'); if (ok && ok.dataset.m !== 'cancel') { const r = onOk(ok.dataset.m, root); if (r !== false) close(); }
  };
  root.onkeydown = e => { if (e.key === 'Escape') close(); };
  const f = $('input,textarea,button', root); f && f.focus();
}

  }

      const k = Math.min(img.width, img.height); g.drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, s, s);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .82)); };
    img.onerror = no; img.src = url;
  });
}
window.addEventListener('pagehide', () => { flushAll(); });

// ---------- Início ----------
const hashTab = (location.hash || '').slice(1);
if (['painel', 'lancamento', 'ranking', 'historico', 'resultados', 'config'].includes(hashTab)) S.tab = hashTab;

// ---------- Acesso (login no Supabase) ----------
let iniciado = false;
function liberar() {
  document.getElementById('login').hidden = true;
  if (!iniciado) { iniciado = true; Store.init(); }
}
function bloquear() {
  document.getElementById('login').hidden = false;
  document.getElementById('lgPass').value = '';
  if (!SB_OK) document.getElementById('lgCfg').hidden = false;
  setTimeout(() => document.getElementById('lgUser').focus(), 30);
}
document.getElementById('loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const u = document.getElementById('lgUser').value.trim().toLowerCase();
  const p = document.getElementById('lgPass').value;
  const err = document.getElementById('lgErr');
  const btn = ev.target.querySelector('button[type=submit]');
  err.textContent = '';
  if (!SB_OK) { err.textContent = 'Sistema ainda não conectado ao Supabase.'; return; }
  if (!u || !p) { err.textContent = 'Informe login e senha.'; return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: u, password: p });
  btn.disabled = false; btn.textContent = 'Entrar';
  if (error) {
    err.textContent = /invalid/i.test(error.message) ? 'Login ou senha incorretos.' : 'Não foi possível entrar: ' + error.message;
    document.getElementById('lgPass').value = '';
    document.getElementById('lgPass').focus();
    return;
  }
  liberar();
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await flushAll(); } catch (e) {}
  try { if (sb) await sb.auth.signOut(); } catch (e) {}
  location.reload();
});
(async () => {
  if (!sb) return bloquear();
  const { data } = await sb.auth.getSession();
  if (data && data.session) liberar(); else bloquear();
  sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT' && iniciado) location.reload(); });
})();
})();
</script>
